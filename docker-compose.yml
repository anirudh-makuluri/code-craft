version: '3.9'
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_PASSWORD:-Your_strong_password123!}
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SQLSERVER_PASSWORD:-Your_strong_password123!}", "-Q", "SELECT 1", "-C"]
      interval: 15s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5023
      CONNECTION_STRING: Server=sqlserver,1433;Database=CodeCraftDb;User Id=sa;Password=${SQLSERVER_PASSWORD:-Your_strong_password123!};TrustServerCertificate=true
      JWT_ISSUER: ${JWT_ISSUER:-codecraft}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-codecraft-ui}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-replace-with-a-long-random-secret}
    ports:
      - "5023:5023"
    depends_on:
      sqlserver:
        condition: service_healthy

  ui:
    build:
      context: ./ui
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:5023
    ports:
      - "3000:3000"
    depends_on:
      - api
